# Cache only successful requests for content-addressed assets indefinitely.
map "$status:$uri" $settled_cache_control {
    default "no-cache, must-revalidate";
    ~^200:/_app/immutable/ "public, max-age=31536000, immutable";
    ~^200:/workbox-[a-fA-F0-9]+\.js$ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The complete hash-based policy is generated in each HTML document.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $settled_cache_control always;

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location ^~ /_app/ {
        try_files $uri =404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
    }

    # Missing static files must never become a successful application shell.
    location ~ /[^/]*\.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
